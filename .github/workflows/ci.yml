name: CI

on:
  push:
    branches: [main, "*-dev", node-patch]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      # --ignore-scripts skips native-module compilation (isolated-vm etc.)
      # we don't need to lint/test/build.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
