name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # Node 24 ships with npm >= 11.5.1, which is required for OIDC trusted publishing.
      # --ignore-scripts skips native-module compilation (e.g., isolated-vm via
      # n8n-workflow's transitive deps). We don't need those compiled for the
      # publish step — only dist/ is published (per `files` in package.json).
      - run: npm ci --ignore-scripts
      # Trusted Publishing via OIDC — no token needed.
      # Requires id-token: write permission (set above) AND the workflow
      # registered as a trusted publisher on npmjs.com.
      - run: npm publish --provenance --access public
