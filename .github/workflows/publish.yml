name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          token: ${{ secrets.NODE_AUTH_TOKEN }}
      # --ignore-scripts skips native-module compilation (e.g., isolated-vm via
      # n8n-workflow's transitive deps). We don't need those compiled for the
      # publish step — only dist/ is published (per `files` in package.json).
      - run: npm ci --ignore-scripts
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
